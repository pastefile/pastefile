# Local development for pastefile.
# Builds the image from this repo's Dockerfile instead of pulling from
# Docker Hub, and exposes the service on host port 8080 so it does not
# clash with a production instance.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml down
#
# See dev.md for the full local-dev workflow.

services:
  pastefile:
    build:
      context: .
      args:
        # Override with: VERSION=$(git describe --tags --always --dirty) docker compose -f ... build
        VERSION: ${VERSION:-dev}
    image: pastefile/pastefile:local
    container_name: pastefile-dev
    ports:
      - "8080:80"
    volumes:
      # Host-mounted data dir. The entrypoint chowns this to uid 33 at
      # startup, so no manual chown is needed.
      - ./data-dev:/data
      # Mount the repo source over the image's copy so edits show up
      # without rebuilding. uwsgi caches Python modules, so after
      # editing run: docker compose -f docker-compose.dev.yml restart
      - ./:/var/www/pastefile
    environment:
      DISABLED_FEATURE: ""           # enable /ls for testing
      PYTHONDONTWRITEBYTECODE: "1"   # keep host source dir free of __pycache__
